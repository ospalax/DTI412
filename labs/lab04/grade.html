<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grade Evaluator</title>
  <style>
    * {
      --main-color: #18bc9c;
      --bg-color: #2c3e50;
      --border-color: #d1d5db;
      --text-color: black;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:monospace,serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .mainform {
      background: var(--bg-color);
      color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
      font-size: 1.5rem;
      color: var(--main-color);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 0.9rem;
    }

    input {
      width: 75%;
      padding: 12px;
      border: 2px solid var(--main-color);
      border-radius: 6px;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .tiny-button {
      width: 10%;
      padding: 12px;
      border: 2px solid var(--main-color);
      border-radius: 6px;
      font-size: 1rem;
      transition: all 0.2s ease;
      justify-content: center;
      font-weight: 800;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--main-color);
      border-radius: 6px;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--main-color);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    button {
      background-color: black;
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: var(--main-color);
    }

    button:active {
      transform: scale(0.98);
    }

    .result-area {
      color: black;
      margin-top: 25px;
      padding: 15px;
      background-color: #f9fafb;
      border-radius: 6px;
      border-left: 4px solid var(--main-color);
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.1rem;
      text-align: center;
      word-break: break-all;
    }

    .placeholder-text {
      color: #9ca3af;
      font-weight: normal;
      font-size: 0.95rem;
    }

    .grade-comment {
      color: white;
      margin-top: 45px;
      padding: 15px;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.5rem;
      text-align: center;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="mainform">
    <h2># Grade Evaluator</h2>

    <div class="form-group">
      <label id="inputLabel" for="inputValue">Points (0-100)</label>
      <input
        type="text"
        id="inputValue"
        placeholder="Enter points (0-100)"
        inputmode="decimal"
      >
      <button class="tiny-button" id="plusBtn">+</button>
      <button class="tiny-button" id="minusBtn">-</button>
    </div>

    <button id="convertBtn">Grade</button>

    <div class="result-area" id="resultArea">
      <span class="placeholder-text">...</span>
    </div>

    <div class="form-group">
      <span class="grade-comment" id="gradeComment">...</span>
    </div>
  </div>

  <script>
    const inputValue = document.getElementById('inputValue');
    const convertBtn = document.getElementById('convertBtn');
    const resultArea = document.getElementById('resultArea');
    const gradeComment = document.getElementById('gradeComment');

    inputValue.addEventListener('input', function(e) {
      let value = this.value;

      value = value.replace(/[^0-9.]/g, '');

      const parts = value.split('.');
      if (parts.length > 2) {
        value = parts[0] + '.' + parts.slice(1).join('');
      }

      this.value = value;
    });

    function validateValue() {
      const rawValue = inputValue.value;

      if (rawValue === '' || rawValue === '.') {
        resultArea.innerHTML = '<span class="placeholder-text" style="color: #ef4444;">Please enter a valid number</span>';
        gradeComment.textContent = 'Error!';
        return;
      }

      const points = parseFloat(rawValue);

      if ((points > 100) || (points < 0)) {
        resultArea.innerHTML = '<span class="placeholder-text" style="color: #ef4444;">Points must be in the range: 0-100</span>';
        gradeComment.textContent = 'Error!';
        return;
      }

      return points;
    }

    function doGrade() {
      const points = validateValue();
      if (points === undefined) return;

      let result = 'F';
      let comment = '...';

      // A = 100 - 80
      // B = 79  - 60
      // C = 59  - 50
      // D = 49  - 40
      // E = 39  - 30
      // F = 29  - 0
      if (points >= 80) {
        result = 'A';
      } else if (points >= 60) {
        result = 'B';
      } else if (points >= 50) {
        result = 'C';
      } else if (points >= 40) {
        result = 'D';
      } else if (points >= 30) {
        result = 'E';
      } else
        result = 'F';

     switch (result) {
         case 'A':
             if (points == 100) {
               comment = 'Perfect!';
             } else
               comment = 'Great Stuff!';
             break;
         case 'B':
             comment = 'Good!';
             break;
         case 'C':
             comment = 'Could Be Worse...';
             break;
         case 'D':
         case 'E':
             comment = 'What Happened?!';
             break;
         default:
             comment = 'This Sucks!';
             break;
     }

      resultArea.textContent = result;
      gradeComment.textContent = comment;
    }

    function incPoint() {
      let points = validateValue();
      if (points === undefined) return;

      if (points < 100) {
          points += 1;
      }

      inputValue.value = points;
      doGrade();
    }

    function decPoint() {
      let points = validateValue();
      if (points === undefined) return;

      if (points > 0) {
          points -= 1;
      }

      inputValue.value = points;
      doGrade();
    }

    convertBtn.addEventListener('click', doGrade);
    plusBtn.addEventListener('click', incPoint);
    minusBtn.addEventListener('click', decPoint);

    inputValue.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        doGrade();
      }
    });
  </script>
</body>
</html>
