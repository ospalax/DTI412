<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit Converter</title>
  <style>
    * {
      --main-color: #18bc9c;
      --bg-color: #2c3e50;
      --border-color: #d1d5db;
      --text-color: black;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:monospace,serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .mainform {
      background: var(--bg-color);
      color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
      font-size: 1.5rem;
      color: var(--main-color);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 0.9rem;
    }

    select, input, button {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--main-color);
      border-radius: 6px;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--main-color);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    button {
      background-color: black;
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: var(--main-color);
    }

    button:active {
      transform: scale(0.98);
    }

    .result-area {
      color: black;
      margin-top: 25px;
      padding: 15px;
      background-color: #f9fafb;
      border-radius: 6px;
      border-left: 4px solid var(--main-color);
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.1rem;
      text-align: center;
      word-break: break-all;
    }

    .placeholder-text {
      color: #9ca3af;
      font-weight: normal;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="mainform">
    <h2># Unit Converter</h2>

    <div class="form-group">
      <label for="conversionType">Direction</label>
      <select id="conversionType">
        <option value="inToCm">Inches to Centimeters (in → cm)</option>
        <option value="cmToIn">Centimeters to Inches (cm → in)</option>
      </select>
    </div>

    <div class="form-group">
      <label id="inputLabel" for="inputValue">Value to Convert</label>
      <input
        type="text"
        id="inputValue"
        placeholder="Enter number..."
        inputmode="decimal"
      >
    </div>

    <button id="convertBtn">Convert</button>

    <div class="result-area" id="resultArea">
      <span class="placeholder-text">...</span>
    </div>
  </div>

  <script>
    const conversionType = document.getElementById('conversionType');
    const inputValue = document.getElementById('inputValue');
    const convertBtn = document.getElementById('convertBtn');
    const resultArea = document.getElementById('resultArea');
    const inputLabel = document.getElementById('inputLabel');

    function updateLabels() {
      if (conversionType.value === 'inToCm') {
        inputLabel.textContent = 'Inches';
      } else {
        inputLabel.textContent = 'Centimeters';
      }
    }
    conversionType.addEventListener('change', updateLabels);
    updateLabels(); // Run initially

    inputValue.addEventListener('input', function(e) {
      let value = this.value;

      value = value.replace(/[^0-9.]/g, '');

      const parts = value.split('.');
      if (parts.length > 2) {
        value = parts[0] + '.' + parts.slice(1).join('');
      }

      this.value = value;
    });

    function performConversion() {
      const rawValue = inputValue.value;

      if (rawValue === '' || rawValue === '.') {
        resultArea.innerHTML = '<span class="placeholder-text" style="color: #ef4444;">Please enter a valid number</span>';
        return;
      }

      const numericValue = parseFloat(rawValue);
      const type = conversionType.value;
      let result = 0;
      let outputText = '';

      if (type === 'inToCm') {
        result = numericValue * 2.54;
        outputText = `${numericValue} in = ${parseFloat(result.toFixed(4))} cm`;
      } else {
        result = numericValue / 2.54;
        outputText = `${numericValue} cm = ${parseFloat(result.toFixed(4))} in`;
      }

      resultArea.textContent = outputText;
    }

    convertBtn.addEventListener('click', performConversion);

    inputValue.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        performConversion();
      }
    });
  </script>
</body>
</html>
