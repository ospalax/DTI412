<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Calculator</title>
  <style>
    * {
      --main-color: #18bc9c;
      --bg-color: #2c3e50;
      --border-color: #d1d5db;
      --text-color: black;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:monospace,serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .mainform {
      background: var(--bg-color);
      color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
      font-size: 1.5rem;
      color: var(--main-color);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .input-group {
      display: flex;
    }

    input {
      width: 75%;
      padding: 12px;
      border: 2px solid var(--main-color);
      border-radius: 6px;
      font-size: 1rem;
      transition: all 0.2s ease;
      display: flex;
      position: relative;
      float: left;
      margin-right: 4%;
    }

    .tiny-button {
      width: 10%;
      height: 10%;
      padding: 12px;
      border: 2px solid var(--main-color);
      border-radius: 6px;
      font-size: 1rem;
      transition: all 0.2s ease;
      justify-content: center;
      font-weight: 800;
      text-align: center;
      display: flex;
      position: relative;
      float: right;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--main-color);
      border-radius: 6px;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--main-color);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    button {
      background-color: black;
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: var(--main-color);
    }

    button:active {
      transform: scale(0.98);
    }

    .result-area {
      color: black;
      margin-top: 25px;
      padding: 15px;
      background-color: #f9fafb;
      border-radius: 6px;
      border-left: 4px solid var(--main-color);
      min-height: 55px;
      /*display: flex;*/
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.1rem;
      text-align: left;
      /*word-break: break-all;*/
    }

    .placeholder-text {
      color: #9ca3af;
      font-weight: normal;
      font-size: 0.95rem;
    }

    .money-comment {
      color: white;
      margin-top: 45px;
      padding: 15px;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.5rem;
      text-align: center;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="mainform">
    <h2># Change Calculator</h2>

    <div class="form-group">
      <label id="inputLabel" for="inputValue">Amount to return (฿):</label>
      <div class="input-group">
      <input
        type="text"
        id="inputValue"
        placeholder="Enter amount to return (฿)"
        inputmode="decimal"
      >
      <button class="tiny-button" id="plusBtn">+</button>
      <button class="tiny-button" id="minusBtn">-</button>
      </div>
    </div>

    <button id="calcBtn">Calculate</button>

    <div class="result-area" id="resultArea">
      <span class="placeholder-text">...</span>
    </div>

    <div class="form-group">
      <span class="money-comment" id="moneyComment">...</span>
    </div>
  </div>

  <script>
    const inputValue = document.getElementById('inputValue');
    const calcBtn = document.getElementById('calcBtn');
    const resultArea = document.getElementById('resultArea');
    const moneyComment = document.getElementById('moneyComment');

    inputValue.addEventListener('input', function(e) {
      let value = this.value;

      value = value.replace(/[^0-9.]/g, '');

      const parts = value.split('.');
      if (parts.length > 2) {
        value = parts[0] + '.' + parts.slice(1).join('');
      }

      this.value = value;
    });

    function validateValue() {
      const rawValue = inputValue.value;

      if (rawValue === '' || rawValue === '.') {
        resultArea.innerHTML = '<span class="placeholder-text" style="color: #ef4444;">Please enter a valid number</span>';
        moneyComment.textContent = 'Error!';
        return;
      }

      const money = parseFloat(rawValue);

      return money;
    }

    function calcChange() {
      let money = validateValue();
      if (money === undefined) return;

      const units = [1000, 500, 100, 50, 20, 10, 5, 2, 1];
        let notesPlusCoins = {};

      let result = ''
      let comment = '';

      for (let step of units) {
          let change = Math.floor(money / step)
          notesPlusCoins[step] = change;
          money %= step;
          if (change) {
              result += '<p>' + `${change}x of ฿${step}` + '</p>';
          }

          comment += `฿${step}` + ' ';
      }

      /*result = JSON.stringify(notesPlusCoins);*/

      resultArea.innerHTML = result;
      moneyComment.textContent = comment;
    }

    function incMoney() {
      let money = validateValue();
      if (money === undefined) return;

      inputValue.value = money + 1;
      calcChange();
    }

    function decMoney() {
      let money = validateValue();
      if (money === undefined) return;

      if (money > 0) {
          money -= 1;
      }

      inputValue.value = money;
      calcChange();
    }

    calcBtn.addEventListener('click', calcChange);
    plusBtn.addEventListener('click', incMoney);
    minusBtn.addEventListener('click', decMoney);

    inputValue.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        calcChange();
      }
    });
  </script>
</body>
</html>
