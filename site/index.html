<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DTI224 - ospalax.cz</title>

  <style>
    * {
      --main-color: #18bc9c;
      --bg-color: #2c3e50;
      --border-color: #d1d5db;
      --text-color: black;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: monospace, serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .mainform {
      background: var(--bg-color);
      color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 650px;
    }

    header, nav {
      width: 85%;
      margin: 0 auto;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    h2 {
      margin-bottom: 20px;
      text-align: left;
      font-size: 1.4rem;
      color: var(--main-color);
    }

    /* Specifically aligns the newly added Apps header */
    main h2 {
      width: 85%;
      margin: 30px auto 15px; /* Adds gap from the nav above */
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 0.9rem;
    }

    nav ul {
      list-style-position: inside;
    }

    nav li {
      margin-bottom: 8px;
    }

    button {
      background-color: black;
      color: white;
      width: 100%;
      max-width: 300px;
      padding: 12px;
      border: 2px solid var(--main-color);
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background-color: var(--main-color);
    }

    button:active {
      transform: scale(0.98);
    }

    a {
      color: var(--main-color);
    }

    p {
      margin-bottom: 20px;
    }

    .apps {
      width: 85%;
      margin: 0 auto; /* Top gap was moved to the main h2 above it */
      padding: 40px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      justify-content: center;
      align-items: center;
    }
  </style>

</head>
<body>

  <div class="mainform">
    <header>
      <h1># DTI224</h1>
      <h2>## <a href="https://www.ospalax.cz/me/">Petr Ospalý</a></h2>
      <p>
      <em>This is a landing page for this repository...</em>
      </p>
      <p>
      More info about me can be found on <a href="https://www.ospalax.cz">my website</a> <i>(also a&nbsp;github page)</i>.
      </p>
    </header>

    <nav>
        <ul>
            <li><a href="https://www.ospalax.cz/me/experience/">Resume</a></li>
            <li><a href="https://www.ospalax.cz/me/contributions/">Contributions</a></li>
            <li><a href="https://github.com/ospalax/">My GitHub</a></li>
        </ul>
    </nav>

    <main>
    <h2>## Apps</h2>
    <section class="apps">
      <button id="multitool" onclick="window.location.href='./wapps/wapp_multitool.html';">[1] Multi-Tool</button>
    </section>
    </main>

  </div>
</body>
</html>
